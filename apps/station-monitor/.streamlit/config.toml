[theme]
base = "light"
primaryColor = "#176B68"
backgroundColor = "#FAFBF8"
secondaryBackgroundColor = "#F0F4F1"
textColor = "#17211F"
linkColor = "#176B68"
borderColor = "#D5DFDA"
codeBackgroundColor = "#EDF2EF"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
redColor = "#B54135"
orangeColor = "#B76A24"
greenColor = "#28795A"
blueColor = "#356D8A"
grayColor = "#63716C"
chartCategoricalColors = ["#176B68", "#D18A3D", "#63716C", "#B54135", "#356D8A", "#7B6B8D"]

[theme.sidebar]
backgroundColor = "#F0F4F1"
secondaryBackgroundColor = "#E6EDE9"
borderColor = "#D5DFDA"

[browser]
gatherUsageStats = false
