# StationWatch Live theme.
#
# This file holds the base look: colours, fonts, radii. Layout-specific styling
# lives in dashboard.css, and the semantic status colours live in PALETTE in
# app.py. Nothing here is secret.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "8px"
buttonRadius = "8px"
linkUnderline = false
showWidgetBorder = true
headingFontSizes = ["30px", "21px", "17px", "15px", "14px", "13px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

[theme.light]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f4f2"
textColor = "#15201d"
borderColor = "#dfe2de"
linkColor = "#0f766e"
codeBackgroundColor = "#f3f4f2"
dataframeHeaderBackgroundColor = "#f3f4f2"
greenColor = "#15803d"
yellowColor = "#b45309"
orangeColor = "#b45309"
redColor = "#b91c1c"
grayColor = "#5b6a66"
chartCategoricalColors = ["#0f766e", "#b45309", "#15803d", "#b91c1c", "#5b6a66"]

[theme.dark]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0d1211"
secondaryBackgroundColor = "#151b1a"
textColor = "#e6ece9"
borderColor = "#28312e"
linkColor = "#2dd4bf"
codeBackgroundColor = "#151b1a"
dataframeHeaderBackgroundColor = "#151b1a"
greenColor = "#34d399"
yellowColor = "#fbbf24"
orangeColor = "#fbbf24"
redColor = "#f87171"
grayColor = "#94a3b8"
chartCategoricalColors = ["#2dd4bf", "#fbbf24", "#34d399", "#f87171", "#94a3b8"]

[browser]
gatherUsageStats = false
